<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>满满中转站</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="theme-lamb">
  <div class="app-shell">
    <header class="top-area">
      <button class="theme-btn" id="themeBtn" type="button" aria-label="切换皮肤">
        <span class="wand-icon">✦</span>
      </button>
      <div class="top-bow"></div>
      <h1>满满中转站</h1>
      <p class="subtitle">把所有小门，都收进这里</p>
    </header>

    <main class="main-area">
      <section class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索网址 / 项目名" autocomplete="off" />
        <button id="clearSearch" class="clear-search" type="button" aria-label="清空搜索">×</button>
      </section>

      <section class="link-section">
        <div class="section-title">
          <span>我的网站</span>
          <i></i>
        </div>
        <div class="scroll-track" id="mySitesTrack"></div>
      </section>

      <section class="link-section compact-section">
        <div class="section-title">
          <span>常用网址</span>
          <i></i>
        </div>
        <div class="scroll-track compact-track" id="commonSitesTrack"></div>
      </section>
    </main>

    <button class="backup-fab" id="backupBtn" type="button" aria-label="导入导出备份">···</button>
    <div class="backup-menu" id="backupMenu">
      <button id="exportBtn" type="button">导出备份</button>
      <button id="importBtn" type="button">导入备份</button>
    </div>
    <input id="importFile" type="file" accept="application/json" hidden />

    <button class="add-fab" id="addBtn" type="button" aria-label="添加网址">＋</button>
  </div>

  <div class="modal-mask" id="modalMask" hidden>
    <form class="site-modal" id="siteForm">
      <h2 id="modalTitle">添加网址</h2>

      <label>
        <span>名称</span>
        <input id="nameInput" type="text" placeholder="例如：拼豆记" required />
      </label>

      <label>
        <span>网址</span>
        <input id="urlInput" type="text" placeholder="https://..." required />
      </label>

      <label>
        <span>分类</span>
        <select id="categoryInput">
          <option value="mine">我的网站</option>
          <option value="common">常用网址</option>
        </select>
      </label>

      <label>
        <span>图标文字</span>
        <input id="iconInput" type="text" maxlength="2" placeholder="可填 1-2 个字，如 拼 / 豆" />
      </label>

      <div class="modal-actions">
        <button class="ghost-btn" id="cancelBtn" type="button">取消</button>
        <button class="save-btn" type="submit">保存</button>
      </div>
    </form>
  </div>

  <script src="./script.js"></script>
</body>
</html>
