<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>甜莓绵羊站</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="theme-sweet">
  <div class="page-shell">
    <header class="hero">
      <div class="gingham top-gingham"></div>
      <button class="theme-btn" id="themeBtn" aria-label="切换皮肤" title="切换皮肤">
        <span class="wand">✦</span>
      </button>

      <div class="bow bow-left">୨୧</div>
      <h1>甜莓绵羊站</h1>
      <p class="subtitle">把所有小门，都收进这里</p>

      <label class="search-wrap" for="searchInput">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索网址 / 项目名" autocomplete="off" />
        <button id="clearSearch" class="clear-btn" type="button" aria-label="清空搜索">×</button>
      </label>
    </header>

    <main>
      <section class="link-section">
        <div class="section-tag">
          <span>我的网站</span>
          <b>🍓</b>
        </div>
        <div class="shortcut-row" id="mySites"></div>
      </section>

      <section class="link-section small-section">
        <div class="section-tag">
          <span>常用网址</span>
          <b>🎀</b>
        </div>
        <div class="shortcut-row compact" id="commonSites"></div>
      </section>
    </main>

    <div class="cake">🍰</div>

    <button class="backup-fab" id="backupBtn" aria-label="备份菜单">···</button>
    <div class="backup-menu" id="backupMenu">
      <button id="exportBtn" type="button">导出备份</button>
      <button id="importBtn" type="button">导入备份</button>
      <input id="importFile" type="file" accept="application/json" hidden />
    </div>

    <button class="add-fab" id="addBtn" aria-label="添加网址">＋</button>
  </div>

  <dialog class="modal" id="linkModal">
    <form method="dialog" class="modal-card" id="linkForm">
      <h2 id="modalTitle">添加网址</h2>

      <label>
        名称
        <input id="nameInput" type="text" placeholder="比如：拼豆记" required />
      </label>

      <label>
        网址
        <input id="urlInput" type="url" placeholder="https://example.com" required />
      </label>

      <label>
        分类
        <select id="categoryInput">
          <option value="mine">我的网站</option>
          <option value="common">常用网址</option>
        </select>
      </label>

      <label>
        图标文字
        <input id="iconInput" type="text" maxlength="2" placeholder="比如：🐑 / 拼 / G" />
      </label>

      <div class="modal-actions">
        <button class="ghost" id="cancelBtn" type="button">取消</button>
        <button class="danger hidden" id="deleteBtn" type="button">删除</button>
        <button class="primary" id="saveBtn" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script src="./script.js"></script>
</body>
</html>
